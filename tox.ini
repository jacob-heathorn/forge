[tox]
envlist = setup, pytest, lint
isolated_build = true

[flake8]
ignore = E126
exclude = scripts/package/.venv
max-line-length = 100
indent-size = 2

[mypy]
mypy_path=src
ignore_missing_imports=True
check_untyped_defs = True
cache_dir = .pycache

# Common
[testenv]
passenv = PROJECT_ROOT,FORGE_ROOT,CMAKE_PREFIX_PATH,GTEST_INCLUDE_DIR
skip_install = true  # Prevents Tox from trying to install via pip
allowlist_externals = poetry,cmake,ansible-playbook
changedir = scripts/package    # Change to the directory where pyproject.toml is

# Unit tests
[testenv:pytest]
commands =
    poetry run pytest {posargs:tests}

# Linting and type checking
[testenv:lint]
deps =
    flake8
    mypy
commands =
    poetry run python -m flake8 --config={toxinidir}/tox.ini {toxinidir}/scripts/package
    ; poetry run python -m mypy --config-file={toxinidir}/tox.ini --package=gordion
