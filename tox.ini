[tox]
envlist = pytest, lint
isolated_build = true

[flake8]
ignore = E126
# TODO unignore cmsis_svd when we use it.
exclude = scripts/package/.venv, scripts/package/forge/cmsis_svd
max-line-length = 100
indent-size = 2

[mypy]
mypy_path=src
ignore_missing_imports=True
check_untyped_defs = True
cache_dir = .pycache

# Common
[testenv]
passenv = PROJECT_ROOT,FORGE_ROOT,CMAKE_PREFIX_PATH,GTEST_INCLUDE_DIR
allowlist_externals = poetry,cmake,ansible-playbook
skip_install = true            # Prevent Tox from trying to install via pip
changedir = scripts/package    # Change to the directory where pyproject.toml is
commands_pre = poetry install  # Install poetry environment in this isolated tox environment

# Unit tests
[testenv:pytest]
commands =
    poetry run pytest {posargs:tests}

# Linting and type checking
[testenv:lint]
deps =
    flake8
    mypy
commands =
    poetry run python -m flake8 --config={toxinidir}/tox.ini {toxinidir}/scripts/package
    poetry run python -m mypy --config-file={toxinidir}/tox.ini --package=forge
